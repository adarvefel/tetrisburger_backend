# --------------------------------------------------
# 1. Configuracion de Conexion a MySQL
# --------------------------------------------------
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# --------------------------------------------------
# 2. Configuracion de JPA/Hibernate
# --------------------------------------------------
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5

# Permitir override (temporal para debug)
spring.main.allow-bean-definition-overriding=true

# --------------------------------------------------
# 3. Configuracion de HikariCP (Pool de Conexiones)
# --------------------------------------------------
spring.datasource.hikari.cache-prep-stmts=true
spring.datasource.hikari.statement-cache-size=250

# --------------------------------------------------
# 4. Configuracion de JWT
# --------------------------------------------------
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION}

# --------------------------------------------------
# 5. Configuracion de Mail
# --------------------------------------------------

# --------------------------------------------------
# 6. Configuracion de Google OAuth
# --------------------------------------------------
google.oauth.client-id=${GOOGLE_OAUTH_CLIENT_ID}

# Frontend URL
app.frontend.url=${APP_FRONTEND_URL}
cors.allowed.origins=${CORS_ALLOWED_ORIGINS}

# --------------------------------------------------
# 7. AWS S3
# --------------------------------------------------
aws.region=${AWS_REGION}
aws.s3.bucket=${AWS_S3_BUCKET}

recaptcha.enabled=true
brevo.api-key=${BREVO_API_KEY}

# S3 Folder Structure
s3.folder.products=${S3_FOLDER_PRODUCTS:products}
s3.folder.users=${S3_FOLDER_USERS:users}
s3.folder.burgers.menu=${S3_FOLDER_BURGERS_MENU:burgers}
s3.folder.addition=${S3_FOLDER_ADDITION:addition}
s3.folder.menus=${S3_FOLDER_MENUS:menus}
s3.folder.invoices=${S3_FOLDER_INVOICES:invoices}

# Swagger
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.packagesToScan=com.tetris.tetrisburger_backend.infrastructure.rest.controller
springdoc.pathsToMatch=/api/**

# Recaptcha v3
recaptcha.secret-key=${RECAPTCHA_SECRET_KEY}
recaptcha.verify-url=${RECAPTCHA_VERIFY_URL}
recaptcha.threshold=${RECAPTCHA_THRESHOLD:0.5}

# Invoice
invoice.generator.api-key=${INVOICE_GENERATOR_API_KEY}

# --------------------------------------------------
# Logs
# --------------------------------------------------
logging.level.root=DEBUG
logging.level.com.tetris=DEBUG

logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN
logging.level.org.springframework.web=WARN
logging.level.org.springframework.data.auditing=WARN
logging.level.org.springframework.data.jpa.repository.config=WARN

# Multipart
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB