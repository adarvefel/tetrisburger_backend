# --------------------------------------------------
# 1. Configuración de Conexión a MySQL
# --------------------------------------------------
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --------------------------------------------------
# 2. Configuración de JPA/Hibernate para MySQL (Se mantienen fijas)
# JPA/Hibernate - Configuración MÍNIMA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# HikariCP - Configuración MÍNIMA
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5

# Permitir override (temporal para debug)
spring.main.allow-bean-definition-overriding=true
# --------------------------------------------------
# 3. Configuración de HikariCP (Pool de Conexiones) (Se mantienen fijas)
# --------------------------------------------------
spring.datasource.hikari.cache-prep-stmts=true
spring.datasource.hikari.statement-cache-size=250

# --------------------------------------------------
# 4. Configuración de JWT (Referencia a variables de entorno)
# --------------------------------------------------
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION}

#----------------------------------------------------
# 5. CONFIGURAVION PARA MAIL (Referencia a variables de entorno)
#----------------------------------------------------
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS_ENABLE}
spring.mail.default-encoding=${MAIL_DEFAULT_ENCODING}

# --------------------------------------------------
# 6. CONFIGURACIÓN DE GOOGLE OAUTH (Referencia a variables de entorno)
# --------------------------------------------------
google.oauth.client-id=${GOOGLE_OAUTH_CLIENT_ID}

# Frontend URL
app.frontend.url=${APP_FRONTEND_URL}
cors.allowed.origins=${CORS_ALLOWED_ORIGINS}


# --------------------------------------------------
# 7. AWS S3 (Referencia a variables de entorno)
# --------------------------------------------------
aws.region=${AWS_REGION}
aws.s3.bucket=${AWS_S3_BUCKET}


# S3 Folder Structure
s3.folder.products=${S3_FOLDER_PRODUCTS:products}
s3.folder.users=${S3_FOLDER_USERS:users}
s3.folder.burgers.custom=${S3_FOLDER_BURGERS_CUSTOM:burgers}
s3.folder.burgers.menu=${S3_FOLDER_BURGERS_MENU:burger-menu}
s3.folder.menus=${S3_FOLDER_MENUS:menus}

# Swagger UI accesible en /swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html

springdoc.api-docs.path=/v3/api-docs

# Para escanear solo tus controllers (tu paquete real)
springdoc.packagesToScan=com.tetris.tetrisburger_backend.infrastructure.rest.controller

# (Opcional) para incluir solo rutas /api/**
springdoc.pathsToMatch=/api/**


# --------------------------------------------------
#  LOGS DE AUDITORÍA (Para debugging)
# --------------------------------------------------
logging.level.org.springframework.data.auditing=DEBUG
logging.level.org.springframework.data.jpa.repository.config=DEBUG
logging.level.com.tetris.tetrisburger_backend.infrastructure.config.AuditorAwareImpl=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE