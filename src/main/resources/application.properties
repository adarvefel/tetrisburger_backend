# --------------------------------------------------
# 1. Configuración de Conexión a MySQL
# --------------------------------------------------
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# --------------------------------------------------
# 2. Configuración de JPA/Hibernate para MySQL (Se mantienen fijas)
# JPA/Hibernate - Configuración MÍNIMA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5

# Permitir override (temporal para debug)
spring.main.allow-bean-definition-overriding=true
# --------------------------------------------------
# 3. Configuración de HikariCP (Pool de Conexiones) (Se mantienen fijas)
# --------------------------------------------------
spring.datasource.hikari.cache-prep-stmts=true
spring.datasource.hikari.statement-cache-size=250

# --------------------------------------------------
# 4. Configuración de JWT (Referencia a variables de entorno)
# --------------------------------------------------
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION}

#----------------------------------------------------
# 5. CONFIGURAVION PARA MAIL (Referencia a variables de entorno)
#----------------------------------------------------
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS_ENABLE}
spring.mail.default-encoding=${MAIL_DEFAULT_ENCODING}

# --------------------------------------------------
# 6. CONFIGURACIÓN DE GOOGLE OAUTH (Referencia a variables de entorno)
# --------------------------------------------------
google.oauth.client-id=${GOOGLE_OAUTH_CLIENT_ID}

# Frontend URL
app.frontend.url=${APP_FRONTEND_URL}
cors.allowed.origins=${CORS_ALLOWED_ORIGINS}


# --------------------------------------------------
# 7. AWS S3 (Referencia a variables de entorno)
# --------------------------------------------------
aws.region=${AWS_REGION}
aws.s3.bucket=${AWS_S3_BUCKET}


recaptcha.enabled=false


# S3 Folder Structure
s3.folder.products=${S3_FOLDER_PRODUCTS:products}
s3.folder.users=${S3_FOLDER_USERS:users}
s3.folder.burgers.menu=${S3_FOLDER_BURGERS_MENU:burgers}
s3.folder.addition=${S3_FOLDER_ADDITION:addition}
s3.folder.menus=${S3_FOLDER_MENUS:menus}
s3.folder.invoices=${S3_FOLDER_INVOICES:invoices}





# Swagger UI accesible en /swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html

springdoc.api-docs.path=/v3/api-docs

# Para escanear solo tus controllers
springdoc.packagesToScan=com.tetris.tetrisburger_backend.infrastructure.rest.controller

# (Opcional) para incluir solo rutas /api/**
springdoc.pathsToMatch=/api/**

#Recaptcha v3
recaptcha.secret-key: ${RECAPTCHA_SECRET_KEY}
recaptcha.verify-url: ${RECAPTCHA_VERIFY_URL}
recaptcha.threshold: ${RECAPTCHA_THRESHOLD:0.5}
# --------------------------------------------------
#  LOGS DE AUDITORÍA (Para debugging)
# --------------------------------------------------
logging.level.org.springframework.data.auditing=DEBUG
logging.level.org.springframework.data.jpa.repository.config=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

invoice.generator.api-key=${INVOICE_GENERATOR_API_KEY}


spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB



logging.level.org.hibernate.SQL=DEBUG
logging.level.com.tetris=DEBUG
logging.level.root=INFO
logging.level.org.springframework.web=DEBUG
